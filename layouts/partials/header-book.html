{{- $meta := site.Data.site_meta -}}
{{- $tg := partial "telegram-url.html" (dict "serviceName" "") -}}
{{- $phone := $meta.contacts.phone -}}
{{- $display := $meta.contacts.phoneDisplay | default $phone -}}
<div class="relative group">
  <button type="button" class="btn-shine inline-flex items-center gap-2 bg-accent text-gray-900 font-medium rounded-pill px-5 py-2.5 text-sm whitespace-nowrap">
    <span class="relative z-[1]">Записаться</span>
    <svg class="relative z-[1] w-4 h-4 shrink-0 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>
  <div class="absolute right-0 top-full pt-2 hidden group-hover:block group-focus-within:block z-50 min-w-[220px]">
    <div class="bg-brand-elevated border border-brand-line shadow-xl rounded-xl overflow-hidden py-1">
      <a href="{{ $tg }}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 px-4 py-3 text-sm hover:text-accent hover:bg-brand-surface transition">
        <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        Telegram
      </a>
      <a href="{{ $meta.contacts.max }}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 px-4 py-3 text-sm hover:text-accent hover:bg-brand-surface transition">
        <span class="w-5 h-5 shrink-0 inline-flex items-center justify-center rounded-full bg-accent/20 text-accent text-xs font-bold">M</span>
        Max
      </a>
      {{- if $phone -}}
      <a href="tel:{{ replaceRE "[\\s()\\-]" "" $phone }}" class="flex items-center gap-3 px-4 py-3 text-sm hover:text-accent hover:bg-brand-surface transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
        {{ $display }}
      </a>
      {{- end -}}
    </div>
  </div>
</div>

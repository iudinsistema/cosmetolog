{{- $meta := site.Data.site_meta -}}
{{- $doctor := $meta.doctor -}}
{{- $withDiploma := strings.Contains $doctor.photo "doctor-diploma" -}}
<div class="flex flex-col md:flex-row gap-8 md:gap-10 items-start mb-10">
  <div class="shrink-0 w-full md:w-auto mx-auto md:mx-0">
    <img src="{{ $doctor.photo | relURL }}" alt="{{ $doctor.name }}"
      class="{{ if $withDiploma }}w-full max-w-[280px] rounded-2xl object-cover object-top aspect-[3/4] shadow-md{{ else }}w-full max-w-[280px] rounded-2xl object-cover aspect-[3/4] shadow-md{{ end }}"
      loading="lazy">
    <p class="mt-3 text-center md:text-left font-medium">{{ $doctor.name }}</p>
    <p class="text-sm text-accent text-center md:text-left">{{ $doctor.role }}</p>
  </div>
  <div class="flex-1 text-brand-muted space-y-4 leading-relaxed min-w-0 page-content">
    {{ .Content }}
  </div>
</div>

{{- $images := . -}}
{{- if $images -}}
<section class="gallery py-8" data-gallery>
  <div class="grid sm:grid-cols-2 gap-6 max-w-4xl mx-auto">
    {{- range $images -}}
    <figure class="gallery__item rounded-xl overflow-hidden border border-brand-line bg-brand-surface">
      <button
        type="button"
        class="gallery__trigger block w-full text-left"
        data-gallery-open
        data-src="{{ .src | relURL }}"
        data-alt="{{ .alt }}"
        {{- with .caption }} data-caption="{{ . }}"{{- end -}}
        aria-label="Увеличить: {{ .alt }}"
      >
        <img src="{{ .src | relURL }}" alt="{{ .alt }}" class="w-full h-auto object-cover" loading="lazy">
      </button>
      {{- with .caption -}}<figcaption class="p-3 text-sm text-brand-muted text-center">{{ . }}</figcaption>{{- end -}}
    </figure>
    {{- end -}}
  </div>
  <div class="gallery-lightbox" data-gallery-lightbox hidden>
    <button type="button" class="gallery-lightbox__backdrop" data-gallery-close aria-label="Закрыть"></button>
    <div class="gallery-lightbox__dialog" role="dialog" aria-modal="true" aria-label="Просмотр документа">
      <button type="button" class="gallery-lightbox__close" data-gallery-close aria-label="Закрыть">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
      <img class="gallery-lightbox__image" src="" alt="">
      <p class="gallery-lightbox__caption"></p>
    </div>
  </div>
</section>
{{- end -}}

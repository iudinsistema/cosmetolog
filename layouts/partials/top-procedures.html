{{- $top := site.Data.top_procedures -}}
<section class="py-12 md:py-16 bg-brand-bg">
  <div class="max-w-[1200px] mx-auto px-4">
    <h2 class="text-2xl md:text-[28px] font-bold text-center text-brand-text mb-2 tracking-tight">{{ $top.title }}</h2>
    <p class="text-center text-brand-muted text-sm md:text-base mb-8 md:mb-10">{{ $top.subtitle }}</p>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-1.5 md:gap-2">
      {{- range $top.items -}}
      <a href="{{ (printf "/%s/" .slug) | relURL }}" class="top-procedure-card overflow-hidden group">
        <img src="{{ .image | relURL }}" alt="{{ .label }}" class="absolute inset-0 w-full h-full object-cover object-center" loading="lazy">
        <div class="top-procedure-card__overlay absolute inset-0 flex items-end justify-center pb-6 px-3">
          <span class="text-white text-center text-[11px] sm:text-xs md:text-sm font-semibold uppercase tracking-wide leading-tight max-w-[95%]">{{ .label }}</span>
        </div>
      </a>
      {{- end -}}
    </div>
  </div>
</section>
